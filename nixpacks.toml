# 7J-BRACKETFONT: per Hxxdie — the live tournament bracket image (and the
# avatar-vs-avatar "VS" badge composite, which has the same latent issue)
# renders text via sharp -> librsvg, which needs a real font installed to
# lay out glyphs at all. Railway's default Nixpacks Node build has zero
# fonts installed, so every character silently falls back to librsvg's
# "tofu" placeholder box instead of failing loudly — this is *not* a bug in
# the SVG generation itself, confirmed by rendering the exact same SVG in a
# sandbox that does have fonts installed, where it renders correctly.
#
# fonts-dejavu-core installs DejaVu Sans/Serif/Mono, a solid, widely-
# available, good-Unicode-coverage font family — index.js's SVG font-family
# stacks now list "DejaVu Sans" first specifically to match this package.
#
# This file only takes effect on Railway's *next* build after it's added to
# the repo — it isn't something index.js alone can fix, since it configures
# the build environment itself, not application code.
[phases.setup]
aptPkgs = ["fonts-dejavu-core", "fontconfig"]

# 7J-BRACKETFONT-2: even with fontconfig installed via aptPkgs above,
# Railway's Nixpacks runtime still failed to auto-locate fontconfig's own
# config file at runtime ("Fontconfig error: Cannot load default config
# file: No such file: (null)") — a known gap in how Nixpacks' apt-installed
# packages interact with fontconfig's default path resolution inside a
# Nix-based image (confirmed as a real recurring issue for exactly this
# Railway + sharp + SVG-in-Discord-bot combination, not something specific
# to this codebase). Explicitly pointing FONTCONFIG_FILE at the config file
# apt's fontconfig package actually installs (/etc/fonts/fonts.conf on
# Debian) sidesteps the broken auto-detection entirely.
[variables]
FONTCONFIG_FILE = "/etc/fonts/fonts.conf"