# 7J-BRACKETFONT: per Hxxdie — the live tournament bracket image (and the
# avatar-vs-avatar "VS" badge composite, which has the same latent issue)
# renders text via sharp -> librsvg, which needs a real font installed to
# lay out glyphs at all. Railway's default Nixpacks Node build has zero
# fonts installed, so every character silently falls back to librsvg's
# "tofu" placeholder box instead of failing loudly.
#
# 7J-BRACKETFONT-3: aptPkgs + FONTCONFIG_FILE alone (see below) turned out
# not to be reliable on Railway's Nixpacks image in practice — confirmed by
# live testing, still tofu boxes on a fresh redeploy. The real fix now lives
# in index.js: it bundles its own font files (assets/fonts/DejaVuSans.ttf +
# DejaVuSans-Bold.ttf — add these two files to the repo root) and generates
# a minimal, fully self-contained fontconfig config pointed only at that
# bundled directory, with no dependency on aptPkgs succeeding or the
# system's default fontconfig resolution working at all. This block is kept
# as a harmless secondary safety net in case it does end up helping, but
# the bundled-font path in index.js is what actually matters now.
[phases.setup]
aptPkgs = ["fonts-dejavu-core", "fontconfig"]

[variables]
FONTCONFIG_FILE = "/etc/fonts/fonts.conf"